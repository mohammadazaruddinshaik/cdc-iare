<!doctype html>
<html lang="en">
  <head>
    <!-- Basic Meta -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />

    <!-- SEO Title & Description -->
    <title>CDC Attendance System | IARE Career Development Centre</title>
    <meta
      name="description"
      content="CDC Attendance System for Institute of Aeronautical Engineering (IARE). Secure QR-based attendance tracking for students and faculty under the Career Development Centre."
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://cdciare.in/" />

    <!-- Search Engine Indexing -->
    <meta name="robots" content="index, follow" />

    <!-- Open Graph (Google / WhatsApp / LinkedIn) -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="CDC Attendance System | IARE" />
    <meta
      property="og:description"
      content="Official CDC Attendance Management System for IARE. Fast, secure, and QR-based attendance for students."
    />
    <meta property="og:url" content="https://cdciare.in/" />
    <!-- Optional: add later if you have a banner -->
    <!-- <meta property="og:image" content="https://cdciare.in/og-image.png" /> -->

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="CDC Attendance System | IARE" />
    <meta
      name="twitter:description"
      content="CDC Attendance System for Institute of Aeronautical Engineering (IARE)."
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <div id="root"></div>

    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <!-- QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <!-- App Entry -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
