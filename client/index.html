<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <title>Career Development Centre - Attendance</title>
    <meta name="description" content="Attendance Management System for Career Development Centre" />
    <meta name="theme-color" content="#0F172A" />

    <link rel="icon" type="image/png" href="/src/assets/cdc-logo.png" />
    <link rel="apple-touch-icon" href="/src/assets/cdc-logo.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
      body {
      margin: 0;
      padding: 0;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #F3F4F6;
      color: #1F2937;
    }
          
      /* Center the loading content */
      .loading-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100%;
        width: 100%;
        animation: fade-in 0.5s ease-out;
      }

      /* CSS Spinner */
      .spinner {
        width: 56px;
        height: 56px;
        border: 4px solid #E5E7EB; /* Light Gray */
        border-bottom-color: #2563EB; /* Blue-600 */
        border-radius: 50%;
        display: inline-block;
        box-sizing: border-box;
        animation: rotation 1s linear infinite;
        margin-bottom: 2rem;
      }

      /* Main Heading */
      .brand-name {
        font-size: 1.75rem;
        font-weight: 800;
        color: #111827; /* Gray-900 */
        text-align: center;
        letter-spacing: -0.025em;
        margin: 0;
        line-height: 1.2;
      }

      /* Caption / Tagline */
      .brand-caption {
        margin-top: 0.75rem;
        font-size: 0.875rem;
        color: #6B7280; /* Gray-500 */
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        text-align: center;
      }

      @keyframes rotation {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes fade-in {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading-container">
        <span class="spinner"></span>
        <h1 class="brand-name">Career Development Centre</h1>
        <p class="brand-caption">Institute of Aeronautical Engineering</p>
      </div>
    </div>

    <noscript>
      <div style="padding: 2rem; text-align: center; margin-top: 20vh;">
        <h2>JavaScript is required</h2>
        <p>We're sorry, but this portal doesn't work properly without JavaScript enabled. Please enable it to continue.</p>
      </div>
    </noscript>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
